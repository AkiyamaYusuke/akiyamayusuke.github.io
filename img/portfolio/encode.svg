<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#12233f"/>
      <stop offset="55%" stop-color="#0b1524"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#54b6ff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#grid)"/>

  <text x="18" y="34" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="3" fill="#54b6ff" opacity="0.85">PRT // STAGE 02</text>
  <circle cx="382" cy="28" r="4" fill="#54b6ff"/>

  <!-- input frames stack -->
  <g transform="translate(40 214)">
    <rect x="0" y="6" width="72" height="54" rx="7" fill="#54b6ff" opacity="0.14"/>
    <rect x="8" y="0" width="72" height="54" rx="7" fill="#54b6ff" opacity="0.24"/>
    <rect x="16" y="-6" width="72" height="54" rx="7" fill="none" stroke="#54b6ff" stroke-width="2"/>
    <path d="M22 14h46M22 24h46M22 34h30" stroke="#9fd4ff" stroke-opacity="0.6" stroke-width="1.4"/>
    <text x="26" y="64" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1" fill="#9fd4ff">FRAME</text>
  </g>

  <!-- arrow -->
  <path d="M132 233 h26 M158 228 l8 5 -8 5 z" fill="#54b6ff" stroke="#54b6ff" stroke-width="1.4"/>

  <!-- encoder chip -->
  <g transform="translate(170 178)">
    <rect x="0" y="0" width="92" height="112" rx="12" fill="#0c1a2e" stroke="#54b6ff" stroke-width="2"/>
    <rect x="10" y="10" width="72" height="30" rx="6" fill="#54b6ff" opacity="0.18"/>
    <text x="46" y="30" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#cfe6ff">H.265</text>
    <g stroke="#54b6ff" stroke-width="1.6" opacity="0.85">
      <line x1="0" y1="24" x2="-10" y2="24"/>
      <line x1="0" y1="52" x2="-10" y2="52"/>
      <line x1="0" y1="80" x2="-10" y2="80"/>
      <line x1="92" y1="24" x2="102" y2="24"/>
      <line x1="92" y1="52" x2="102" y2="52"/>
      <line x1="92" y1="80" x2="102" y2="80"/>
    </g>
    <text x="46" y="66" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e6f2ff" font-weight="700">ENC</text>
    <text x="46" y="84" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="8" letter-spacing="2" fill="#9fd4ff">MEDIACODEC</text>
    <circle cx="86" cy="102" r="2.5" fill="#54b6ff"/>
  </g>

  <!-- arrow out -->
  <path d="M282 233 h26 M308 228 l-8 -5 v10 z" fill="none" stroke="#54b6ff" stroke-width="1.6"/>
  <path d="M308 228 l8 5 -8 5 z" fill="#54b6ff"/>

  <!-- NAL stream blocks -->
  <g transform="translate(318 208)">
    <rect x="0" y="0" width="46" height="50" rx="6" fill="#0c1a2e" stroke="#54b6ff" stroke-width="1.6"/>
    <rect x="3" y="6" width="40" height="7" rx="2" fill="#54b6ff" opacity="0.85"/>
    <text x="23" y="34" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#9fd4ff">NAL</text>
    <g opacity="0.4" fill="#54b6ff">
      <rect x="14" y="58" width="40" height="7" rx="2"/>
      <rect x="14" y="72" width="40" height="7" rx="2"/>
    </g>
    <rect x="60" y="58" width="40" height="7" rx="2" fill="#54b6ff" opacity="0.55"/>
  </g>

  <!-- bitstream strip -->
  <g transform="translate(60 360)">
    <text x="0" y="0" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1" fill="#9fd4ff">BITSTREAM // QP 32 → GOP</text>
    <g stroke="#54b6ff" stroke-width="1.6" opacity="0.9">
      <path d="M0 22 h10 M14 22 h6 M24 22 h16 M44 22 h4 M52 22 h12 M68 22 h6 M78 22 h18 M100 22 h5 M109 22 h11 M124 22 h9"/>
      <path d="M0 30 h24 M28 30 h6 M38 30 h20 M62 30 h8 M74 30 h13 M91 30 h5 M100 30 h7 M111 30 h22 M137 30 h4"/>
    </g>
  </g>

  <!-- sparkline 13.8x -->
  <g transform="translate(60 410)">
    <text x="0" y="0" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1" fill="#9fd4ff">THROUGHPUT</text>
    <polyline points="0,46 40,40 80,30 120,18 160,12 200,10 240,8 280,6"
      fill="none" stroke="#54b6ff" stroke-width="2"/>
    <polygon points="0,60 0,46 40,40 80,30 120,18 160,12 200,10 240,8 280,6 280,60"
      fill="#54b6ff" opacity="0.12"/>
    <circle cx="280" cy="6" r="3" fill="#e6f2ff"/>
    <text x="288" y="4" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#e6f2ff" font-weight="700">×13.8</text>
  </g>

  <line x1="18" y1="520" x2="382" y2="520" stroke="#54b6ff" stroke-opacity="0.35"/>
  <text x="22" y="546" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="700" fill="#e6f2ff" letter-spacing="1">ENCODE</text>
  <text x="22" y="572" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#9fd4ff">编码推流 · H.264 / H.265 · InputSurface · bitstream 级调优</text>
</svg>
