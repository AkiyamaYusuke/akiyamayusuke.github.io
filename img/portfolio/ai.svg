<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#0e2418"/>
      <stop offset="55%" stop-color="#091710"/>
      <stop offset="100%" stop-color="#040a06"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#63e6a0" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#grid)"/>

  <text x="18" y="34" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="3" fill="#63e6a0" opacity="0.9">PRT // STAGE 06</text>
  <circle cx="382" cy="28" r="4" fill="#63e6a0"/>

  <!-- sense chain label -->
  <g transform="translate(96 66)">
    <g fill="#63e6a0" opacity="0.9">
      <circle cx="0" cy="0" r="3.4"/>
      <circle cx="104" cy="0" r="3.4"/>
      <circle cx="208" cy="0" r="3.4"/>
    </g>
    <line x1="8" y1="0" x2="96" y2="0" stroke="#63e6a0" stroke-width="1.4" opacity="0.7"/>
    <line x1="112" y1="0" x2="200" y2="0" stroke="#63e6a0" stroke-width="1.4" opacity="0.7"/>
    <g font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#c8ffe4">
      <text x="20" y="-8">SENSE</text>
      <text x="132" y="-8">AI · EDGE</text>
      <text x="236" y="-8">ACT</text>
