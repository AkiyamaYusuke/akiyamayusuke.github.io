<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#14203d"/>
      <stop offset="55%" stop-color="#0b1426"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8a7bff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#grid)"/>

  <text x="18" y="34" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="3" fill="#8a7bff" opacity="0.9">PRT // STAGE 03</text>
  <circle cx="382" cy="28" r="4" fill="#8a7bff"/>

  <!-- sender node -->
  <g transform="translate(46 236)">
    <rect x="0" y="0" width="52" height="52" rx="26" fill="#8a7bff" opacity="0.14" stroke="#8a7bff" stroke-width="1.6"/>
    <text x="26" y="32" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e9e4ff" font-weight="700">SND</text>
  </g>

  <!-- egress packets top route -->
  <g stroke="#8a7bff" stroke-width="1.6">
    <path d="M98 240 h44 M154 240 h28" opacity="0.9"/>
  </g>
  <g fill="#cfc5ff">
    <rect x="150" y="232" width="24" height="16" rx="3" opacity="0.5"/>
    <rect x="182" y="228" width="24" height="16" rx="3" opacity="0.8"/>
    <rect x="214" y="232" width="24" height="16" rx="3" fill="#e9e4ff"/>
  </g>

  <!-- network cloud / arc -->
  <g transform="translate(120 150)">
    <path d="M0 70 A110 90 0 0 1 160 70" fill="none" stroke="#8a7bff" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.5"/>
    <path d="M8 92 A110 90 0 0 1 168 92" fill="none" stroke="#8a7bff" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.5"/>
  </g>

  <!-- receiver node -->
  <g transform="translate(302 236)">
    <rect x="0" y="0" width="52" height="52" rx="26" fill="#8a7bff" opacity="0.14" stroke="#8a7bff" stroke-width="1.6"/>
    <text x="26" y="32" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e9e4ff" font-weight="700">RCV</text>
  </g>

  <!-- feedback loop RTCP back -->
  <g stroke="#cfc5ff" stroke-width="1.3" fill="none" opacity="0.8">
    <path d="M328 292 q0 46 -120 46 q-122 0 -122 -52" stroke-dasharray="4 5"/>
    <path d="M86 286 l8 -5 v10 z" fill="#cfc5ff"/>
  </g>
  <text x="150" y="396" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="2" fill="#cfc5ff">RTCP → GCC → RATE</text>

  <!-- protocol row -->
  <g transform="translate(40 320)">
    <g font-family="ui-monospace,Consolas,monospace">
      <rect x="0" y="0" width="66" height="22" rx="5" fill="none" stroke="#8a7bff" stroke-width="1.4"/>
      <text x="33" y="15" text-anchor="middle" font-size="10" fill="#cfc5ff">RTP</text>
      <rect x="78" y="0" width="78" height="22" rx="5" fill="none" stroke="#8a7bff" stroke-width="1.4"/>
      <text x="117" y="15" text-anchor="middle" font-size="10" fill="#cfc5ff">RTSP</text>
      <rect x="168" y="0" width="104" height="22" rx="5" fill="none" stroke="#8a7bff" stroke-width="1.4"/>
      <text x="220" y="15" text-anchor="middle" font-size="10" fill="#cfc5ff">WebRTC</text>
      <rect x="284" y="0" width="70" height="22" rx="5" fill="none" stroke="#8a7bff" stroke-width="1.4"/>
      <text x="319" y="15" text-anchor="middle" font-size="10" fill="#cfc5ff">SRT</text>
    </g>
  </g>

  <g transform="translate(66 458)">
    <g font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1" fill="#cfc5ff">
      <text x="0" y="0">UDP / TCP 自适应 · ICE 穿透 · JitterBuffer</text>
      <text x="0" y="22">NACK + FEC 弱网对抗 · 码率随带宽联动</text>
    </g>
    <line x1="0" y1="38" x2="268" y2="38" stroke="#8a7bff" stroke-opacity="0.4"/>
  </g>

  <line x1="18" y1="520" x2="382" y2="520" stroke="#8a7bff" stroke-opacity="0.35"/>
  <text x="22" y="546" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="700" fill="#ece7ff" letter-spacing="1">TRANSPORT</text>
  <text x="22" y="572" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#c4b8ff">传输网络 · 低延迟 · QoS 闭环 · NAT 穿透</text>
</svg>
