    <circle cx="60" cy="40" r="14" fill="#63e6a0" opacity="0.25"/>
    <circle cx="60" cy="40" r="6" fill="#c8ffe4"/>
    <text x="8" y="88" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#c8ffe4">CAM · 端侧感知</text>
  </g>

  <!-- NPU chip + neural -->
  <g transform="translate(150 160)">
    <rect x="0" y="0" width="100" height="116" rx="12" fill="#0d2416" stroke="#63e6a0" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#c8ffe4" letter-spacing="1">EDGE NPU</text>
    <g stroke="#63e6a0" stroke-width="1.3" fill="none">
      <path d="M16 40 c14 -10 22 6 34 -2 M16 58 c14 -10 22 6 34 -2 M16 76 c14 -10 22 6 34 -2"/>
      <path d="M84 40 c-14 10 -22 -6 -34 2 M84 58 c-14 10 -22 -6 -34 2 M84 76 c-14 10 -22 -6 -34 2"/>
    </g>
    <circle cx="16" cy="40" r="3" fill="#c8ffe4"/><circle cx="84" cy="58" r="3" fill="#c8ffe4"/>
    <circle cx="50" cy="58" r="4" fill="#63e6a0" opacity="0.9"/>
    <circle cx="16" cy="76" r="3" fill="#63e6a0"/><circle cx="84" cy="40" r="3" fill="#63e6a0"/>
    <g stroke="#63e6a0" stroke-width="1.4" opacity="0.8">
      <line x1="0" y1="30" x2="-8" y2="30"/><line x1="100" y1="30" x2="108" y2="30"/>
      <line x1="0" y1="92" x2="-8" y2="92"/><line x1="100" y1="92" x2="108" y2="92"/>
    </g>
    <text x="50" y="108" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="8" letter-spacing="1" fill="#c8ffe4">YOLO · OpenCV · TFLite</text>
  </g>

  <!-- link node -->
  <path d="M262 218 h26 M288 213 l8 5 -8 5 z" fill="#63e6a0" stroke="#63e6a0" stroke-width="1.5"/>

  <!-- actuator arm -->
  <g transform="translate(300 196)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#63e6a0" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#63e6a0"/>
    <path d="M0 10 L0 44 L-34 78" fill="none" stroke="#63e6a0" stroke-width="3"/>
    <circle cx="-34" cy="78" r="7" fill="#63e6a0"/>
    <path d="M-34 85 L-34 104 L-14 124 M-34 104 L-58 120" stroke="#c8ffe4" stroke-width="2" fill="none" opacity="0.85"/>
    <text x="24" y="150" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#c8ffe4">ARM</text>
  </g>

  <g transform="translate(46 420)">
    <g font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1" fill="#c8ffe4">
