  <line x1="18" y1="520" x2="382" y2="520" stroke="#63e6a0" stroke-opacity="0.35"/>
  <text x="22" y="546" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="700" fill="#eafff3" letter-spacing="1">EDGE AI</text>
  <text x="22" y="572" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#c8ffe4">端侧 AI · 感知 · 具身智能「传输中间层」</text>
